worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm model/gltf-binary application/octet-stream;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = /index.html { expires -1; }
        # Vite content-hashed files are safe to cache across deployments.
        location ^~ /assets/ { expires 1y; try_files $uri =404; }
        # Unhashed public assets revalidate after one hour, not one year.
        # Missing model/texture requests must be a real 404, never index.html.
        location ~* \.(?:glb|gltf|bin|wasm|jpg|jpeg|png|webp|avif|svg|ico|woff2?|ttf|js|css|json|pdf)$ {
            expires 1h;
            try_files $uri =404;
        }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
